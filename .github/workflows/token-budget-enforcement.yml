name: token-budget-enforcement

on:
  pull_request:
  push:
    branches: [main]

jobs:
  token-budget-enforcement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run token budget fixtures
        run: make token-budget-fixtures

      - name: Upload token budget fixture results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-budget-fixture-results
          path: /tmp/gaia-token-budget-fixture-results.json
