name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan for secrets
        uses: docker://gitleaks/gitleaks:8.18.2
        with:
          args: detect --source . --no-git -v
