name: self-evolution-evidence

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

jobs:
  self-evolution-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce self-evolution evidence rubric
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 ./tools/check-self-evolution-evidence.py --require-context
