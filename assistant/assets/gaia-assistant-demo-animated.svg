<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" fill="none">
  <defs>
    <style>
      .frame { fill: #0B1220; }
      .panel { fill: #101A2E; stroke: #2A3C64; }
      .titlebar { fill: #172440; }
      .title { fill: #D8E5FF; font-family: monospace; font-size: 20px; }
      .cmd { fill: #8CE99A; font-family: monospace; font-size: 16px; }
      .ok { fill: #8CE99A; font-family: monospace; font-size: 16px; }
      .warn { fill: #F7D070; font-family: monospace; font-size: 16px; }
      .text { fill: #CBD9F8; font-family: monospace; font-size: 16px; }
      .meta { fill: #9AB6E9; font-family: monospace; font-size: 16px; }
      .line {
        opacity: 0;
        animation: reveal 22.00s linear infinite;
      }
      .l1 { animation-delay: 0.20s; }
      .l2 { animation-delay: 0.65s; }
      .l3 { animation-delay: 1.10s; }
      .l4 { animation-delay: 1.55s; }
      .l5 { animation-delay: 2.00s; }
      .l6 { animation-delay: 2.45s; }
      .l7 { animation-delay: 2.90s; }
      .l8 { animation-delay: 3.35s; }
      .l9 { animation-delay: 3.80s; }
      .l10 { animation-delay: 4.25s; }
      .l11 { animation-delay: 4.70s; }
      .l12 { animation-delay: 5.15s; }
      .l13 { animation-delay: 5.60s; }
      .l14 { animation-delay: 6.05s; }
      .l15 { animation-delay: 6.50s; }
      .l16 { animation-delay: 6.95s; }
      .l17 { animation-delay: 7.40s; }
      .l18 { animation-delay: 7.85s; }
      .l19 { animation-delay: 8.30s; }
      .l20 { animation-delay: 8.75s; }
      .l21 { animation-delay: 9.20s; }
      .l22 { animation-delay: 9.65s; }
      .l23 { animation-delay: 10.10s; }
      .l24 { animation-delay: 10.55s; }
      .l25 { animation-delay: 11.00s; }
      .cursor {
        animation: blink 1s steps(1, end) infinite;
      }
      .bar-bg { fill: #294170; }
      .bar-fill {
        fill: #8CE99A;
        transform-origin: 0 0;
        animation: fillbar 22.00s linear infinite;
      }
      @keyframes reveal {
        0% { opacity: 0; }
        3% { opacity: 1; }
        100% { opacity: 1; }
      }
      @keyframes blink {
        0% { opacity: 0; }
        50% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes fillbar {
        0% { transform: scaleX(0.03); }
        30% { transform: scaleX(0.30); }
        60% { transform: scaleX(0.64); }
        100% { transform: scaleX(1); }
      }
    </style>
  </defs>

  <rect class="frame" width="1280" height="980" rx="20"/>
  <rect class="panel" x="34" y="28" width="1212" height="924" rx="16"/>
  <rect class="titlebar" x="34" y="28" width="1212" height="54" rx="16"/>
  <circle cx="72" cy="55" r="8" fill="#FF5F57"/>
  <circle cx="100" cy="55" r="8" fill="#FEBC2E"/>
  <circle cx="128" cy="55" r="8" fill="#28C840"/>
  <text x="160" y="62" class="title">gaia assistant animated walkthrough (generated from executable traces)</text>

  <text x="64" y="122" class="cmd line l1">$ gaia onboard --provider openai --api-key &lt;preview-openai-key&gt; --model gpt-4.1-mini --yes</text>
  <text x="64" y="147" class="ok line l2">[ok] selected provider: openai</text>
  <text x="64" y="172" class="ok line l3">[ok] reasoning provider configured</text>
  <text x="64" y="197" class="text line l4">model:    gpt-4.1-mini</text>
  <text x="64" y="222" class="cmd line l5">$ gaia doctor</text>
  <text x="64" y="247" class="ok line l6">[ok] required command found: python3</text>
  <text x="64" y="272" class="ok line l7">[ok] reasoning config: openai/gpt-4.1-mini</text>
  <text x="64" y="297" class="text line l8">Doctor finished with no blocking problems.</text>
  <text x="64" y="322" class="cmd line l9">$ gaia chat --response-profile concise</text>
  <text x="64" y="347" class="text line l10">Started session: &lt;session-id&gt;</text>
  <text x="64" y="372" class="text line l11">Response profile: concise (override)</text>
  <text x="64" y="397" class="text line l12">gaia&gt; [local-openai][profile=concise] Need concise updates</text>
  <text x="64" y="422" class="cmd line l13">$ gaia traces --type chat_turn --last 1 --json</text>
  <text x="64" y="447" class="text line l14">trace_id=&lt;trace-id&gt; action=chat_turn status=ok profile=concise</text>
  <text x="64" y="472" class="cmd line l15">$ gaia feedback record --label not-helpful --session-id &lt;session-id&gt; --trace-id &lt;trace-id&gt; --correction &quot;Need tighter action bullets&quot;</text>
  <text x="64" y="497" class="text line l16">&lt;feedback-id&gt; not helpful session=&lt;session-id&gt; trace=&lt;trace-id&gt;</text>
  <text x="64" y="522" class="cmd line l17">$ gaia memory add --type user_long --subject user:preview --content &quot;User prefers concise actionable updates.&quot; --summary &quot;concise preference seed&quot; --consent-scope user --confidence 0.9 --importance 0.8</text>
  <text x="64" y="547" class="text line l18">&lt;seed-memory-id&gt; user_long user:preview consent=user ttl=P180D</text>
  <text x="64" y="572" class="cmd line l19">$ gaia memory summarize --subject user:preview --response-profile concise --json</text>
  <text x="64" y="597" class="text line l20">summary_memory_id=&lt;summary-memory-id&gt; selected_source_count=1</text>
  <text x="64" y="622" class="text line l21">response_profile=concise summary_event_id=&lt;summary-event-id&gt;</text>
  <text x="64" y="647" class="cmd line l22">$ gaia traces --type feedback_record --last 1</text>
  <text x="64" y="672" class="text line l23">&lt;timestamp&gt; | feedback_record      | safe      | ok      | -        | saved &lt;feedback-id&gt;</text>
  <rect x="64" y="713" width="1150" height="96" rx="12" fill="#0D1628" stroke="#33507E"/>
  <text x="88" y="785" class="meta line l24">capabilities: onboarding, response-profile chat, feedback linkage, memory summarize, trace visibility</text>
  <text x="88" y="811" class="meta line l25">source-of-truth transcript: assistant/assets/gaia-assistant-live-preview-transcript.md</text>
  <rect x="64" y="831" width="1150" height="16" rx="8" class="bar-bg"/>
  <rect x="64" y="831" width="1150" height="16" rx="8" class="bar-fill"/>
  <text x="64" y="883" class="cmd line l23">$ gaia traces --last 5<tspan class="cursor">_</tspan></text>
</svg>
